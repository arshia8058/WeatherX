name: Publish WeatherX native Android preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to android-release-version.txt
        required: false
        type: string

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android unit, lint, emulator install and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: |
            set +e
            ./gradlew --no-daemon testDebugUnitTest lintDebug connectedDebugAndroidTest assembleDebug > "$RUNNER_TEMP/android-release-tests.log" 2>&1
            result=$?
            if [ "$result" -ne 0 ]; then
              summary=$(tail -n 55 "$RUNNER_TEMP/android-release-tests.log" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
              echo "::error title=Native release verification failure::$summary"
              exit "$result"
            fi
            tail -n 20 "$RUNNER_TEMP/android-release-tests.log"
      - name: Prepare APK and release notes
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/WeatherX-Android-1.1.0-debug.apk
          cat > release-notes.md <<'EOF'
          WeatherX Native Android preview. This is the Kotlin and Jetpack Compose application; it does not embed or load the WeatherX website.

          - Application ID: `com.arshia8058.weatherx`
          - Version: `1.1.0` (version code `2`)
          - Minimum Android: 8.0 (API 26)
          - The APK is debug-signed for direct installation and testing. It is not a Play Store production build.
          - Weather and air-quality information is requested directly from Open-Meteo. Location is optional and requires user permission.
          EOF
      - name: Select and validate release tag
        id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG_INPUT" ]]; then
            TAG="$TAG_INPUT"
          else
            TAG="$(< android-release-version.txt)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-android[.][0-9]+$ ]]; then
            echo "Expected a tag such as v1.1.0-android.1; got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish tested native APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/*.apk --target "$GITHUB_SHA" --title "WeatherX Android $RELEASE_TAG" --notes-file release-notes.md --prerelease
