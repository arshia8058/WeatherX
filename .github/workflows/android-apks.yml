name: Native Android CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apks.yml'
      - '.github/workflows/android-release.yml'
      - 'android-release-version.txt'
      - 'android/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: native-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests, lint, and assemble native APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          result=$?
          if [[ $result -ne 0 ]]; then
            summary=$(tail -n 55 "$RUNNER_TEMP/gradle-build.log")
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=Gradle build failure::$summary"
            exit "$result"
          fi
          tail -n 25 "$RUNNER_TEMP/gradle-build.log"
      - name: Upload native debug APK
        uses: actions/upload-artifact@v7
        with:
          name: WeatherX-native-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch WeatherX in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
