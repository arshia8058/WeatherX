name: Build WeatherX Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apks.yml'
      - 'android/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'css/**'
      - 'index.html'
      - 'js/**'
      - 'native/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Sync Capacitor Android project
        run: npm run cap:sync
      - name: Build APK variants
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect ARM64 and universal APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk artifacts/WeatherX-arm64-v8a-debug.apk
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk artifacts/WeatherX-universal-debug.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WeatherX-Android-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
